aliyun_cn:                         # 国内站阿里云账号组（下一层账号名可自定义）
  cn1:
    access_key: "${CN1_AK}"
    access_secret: "${CN1_SK}"
    region: "cn-hangzhou"

aliyun_intl:                       # 国际站阿里云账号组
  intl1:
    access_key: "${INTL1_AK}"
    access_secret: "${INTL1_SK}"
    region: "ap-southeast-1"

cloudflare:
  cloudflare1:
    api_token: "${CF_TOKEN_1}"
    account_id: "${CF_ACCOUNT_ID_1}"

# 每个域名项自带 deploy（部署平台），账号按该平台分组下第一个账号自动推断
# （aliyun_cn->cn1，aliyun_intl->intl1）；平台下有多个账号时才需显式写 deploy_account。
# WAF：waf_id 留空则按该域名 deploy 平台/账号自动发现实例；.env 的 *_WAF_INSTANCE_ID 仅兜底。
# WAF CNAME 自动解析：在需要切流量到 WAF 的域名项下加 cname_domains，列出要解析的域名，
# 程序接入成功后取 WAF 分配的 Cname 自动写 CNAME（存在则改、不存在则加），用证书的 dns_account 写入。
# cname_proxied 仅 Cloudflare 生效：是否开橙云代理，默认 true；写 false 则灰云仅 DNS。
# 例如接入 *.xxx.com 时希望 xxx.com(主域@) 和 cdn.xxx.com 都走 WAF：
#     cname_domains:
#       - "xxx.com"
#       - "cdn.xxx.com"
#     cname_proxied: true

