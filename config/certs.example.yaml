# cert-manager 配置示例
# 复制为 certs.yaml 后填写。
#
# 账号层级写在下面：aliyun_cn / aliyun_intl（下一层账号名可自定义）/ cloudflare；
# 凭证值用 ${VAR} 从 config/.env 注入（复制 .env.example 为 .env 并填写）。
# WAF 实例 ID 也在 .env（ALIYUN_CN_CN1_WAF_INSTANCE_ID / CN1_WAF_INSTANCE_ID 等，按平台+账号对应）。
# 服务器 crontab 里内联的同名环境变量优先级高于 .env。
#
# 第一层是平台、第二层是账号名：证书的 dns 填平台名（aliyun_cn/aliyun_intl/cloudflare），
# dns_account 填该平台下的账号名（cn1/intl1/cloudflare1）；deploy 填部署平台，deploy_account 填该平台下账号名。
#
# 配置以「证书」为单位：每张证书自带 dcdn_domains（DCDN 加速域名）和/或 waf_domains（WAF 防护域名）。
# 不再需要顶层 dcdn_domains，也不需要 cert 交叉引用。
# certificates[] 字段速查：
#   name            可选，证书标识 = CAS 证书名前缀；省略时取主域名
#   dns             可选，默认 aliyun_cn；平台名 aliyun_cn / aliyun_intl / cloudflare
#   dns_account     可选，DNS-01 账号名：省略时按 dns 平台取该分组下第一个账号
#                   （aliyun_cn->cn1 / aliyun_intl->intl1 / cloudflare->第一个）；
#                   平台下有多个账号、需指定某个时才写（如 cn1/intl1/cloudflare1）
#   domains         可选，真正签进证书的 SAN 列表；省略时由 dcdn_domains + waf_domains 去重推导
#   deploy          可选，证书级默认部署平台（aliyun_cn / aliyun_intl），与 deploy_account 配对
#   deploy_account  可选，证书级默认部署账号（该平台下的账号名）；单个域名可用同名键覆盖
#   dcdn_domains    要绑定的加速域名：字符串简写，或 {domain, deploy, deploy_account} 覆盖平台/账号
#   waf_origin      WAF 证书级源站（IP 或域名），供所有 waf_domains 共用
#   waf_zone        WAF 地域：cn=中国内地(cn-hangzhou) / intl=非中国内地(ap-southeast-1)；
#                   每地域自动发现该账号下唯一实例，无需填实例 ID（证书级/域名级均可写）
#   waf_id          可选高级覆盖：显式 WAF 实例 ID，填了就不再自动发现（多实例时才需要）
#   waf_domains     WAF 防护域名：字符串列表即可；未接入的域名用 waf_origin 自动接入（HTTP 80 起步）
#                   （个别域名源站/平台/账号/zone 不同时才展开 {domain, origin, deploy, deploy_account, waf_zone} 对象）
#
# 改完先跑：python3 certmgr.py --config config/certs.example.yaml --check
# 旧格式（顶层 dcdn_domains + cert 引用）仍可自动识别，见文件末尾迁移说明。

aliyun_cn:                         # 国内站阿里云账号组；下一层账号名可自定义（cn1/cn2/...）
  cn1:
    access_key: "${CN1_AK}"
    access_secret: "${CN1_SK}"
    region: "cn-hangzhou"

aliyun_intl:                       # 国际站阿里云账号组；下一层账号名可自定义（intl1/...）
  intl1:
    access_key: "${INTL1_AK}"
    access_secret: "${INTL1_SK}"
    region: "ap-southeast-1"
    # endpoint: "ap-southeast-1.aliyuncs.com"

cloudflare:
  cloudflare1:
    api_token: "${CF_TOKEN_1}"       # -> acme.sh 的 CF_Token
    account_id: "${CF_ACCOUNT_ID_1}" # 可选 -> CF_Account_ID
    # email: "${CF_EMAIL_1}"         # 仅旧版 Global Key 方式需要

certificates:
  # 例1：显式 domains —— 需要泛域 / 裸域 / 额外 SAN 时必须写。
  #      三个域名一次签成同一张 SAN 证书；xxx.example.com 只签不部署到 DCDN。
  - name: "example.com"
    dns: aliyun_cn
    dns_account: cn1
    deploy: aliyun_cn               # 部署平台（aliyun_cn / aliyun_intl）
    deploy_account: cn1             # 该平台下账号，下面所有域名的默认部署账号
    domains:
      - "example.com"
      - "*.example.com"
      - "xxx.example.com"
    dcdn_domains:
      - "www.example.com"           # 字符串简写：使用证书级 deploy 平台 + deploy_account
      - "api.example.com"
      - "app.example.com"
      - "example.com"
      - domain: "intl.example.com"  # 换平台/账号时才展开成对象
        deploy: aliyun_intl
        deploy_account: intl1

  # 例2：省略 domains —— 由 dcdn_domains 的域名去重推导 SAN（纯具体域名证书）。
  #      等价于 domains: ["cn.example.org", "www.example.org"]，推导后按字典序排序，
  #      首项即主域名（acme.sh 目录名）。想固定主域名或加泛域，请显式写 domains。
  - name: "example.org"
    dns: cloudflare
    dns_account: cloudflare1
    deploy: aliyun_intl
    deploy_account: intl1
    dcdn_domains:
      - "www.example.org"
      - domain: "cn.example.org"
        deploy: aliyun_cn
        deploy_account: cn1

  # 例3：WAF 3.0 防护域名。证书换名上传（acme_waf_ 前缀），不与 DCDN 同名冲突。
  #      统一用证书级 waf_origin（源站）+ waf_domains（域名字符串列表）即可，无需逐域名写 origin。
  #      已接入的域名只校验证书并按需切引用；确实未接入的用 waf_origin 自动 CreateDomain。
  - name: "waf.example.net"
    dns: aliyun_cn
    dns_account: cn1
    deploy: aliyun_cn
    deploy_account: cn1
    domains: ["waf.example.net", "*.example.net"]   # waf 域名需在 SAN 内
    waf_zone: cn                                     # cn=中国内地 / intl=非中国内地；自动发现该地域唯一实例
    waf_origin: ["1.2.3.4", "1.2.3.5"]              # 源站 IP 或回源域名，供所有 waf 域名共用
    waf_domains:
      - "waf.example.net"            # 已接入 WAF：仅替换证书
      - "new.example.net"            # 未接入：用 waf_origin 自动接入再开 443 绑证书
    # 仅当某域名平台/账号/zone/源站与证书级不同时，才展开成对象：
    #   - domain: "special.example.net"
    #     deploy: aliyun_intl        # 这个 WAF 域名改到国际站 intl1（证书级默认是 aliyun_cn/cn1）
    #     deploy_account: intl1
    #     waf_zone: intl             # 该域名的 WAF 地域（cn/intl），各自自动发现实例
    #     origin: ["5.6.7.8"]
    # 多实例需指定时才用 waf_id 显式写实例 ID（填了就不再自动发现）

  # 例4：同一张证书既有 DCDN 又有 WAF，且部署到不同账号。
  #      也可不写证书级 deploy/deploy_account，把 deploy 写在每个域名项上（更清晰）；
  #      域名只写 deploy 未写 deploy_account 时，自动取该平台分组下的第一个账号。
  #      dcdn_domains 与 waf_domains 各自按 (证书, 平台, 账号) 分组，互不干扰。
  - name: "mix.example.com"
    dns: cloudflare                  # DNS 验证在 Cloudflare，与部署账号无关
    dns_account: cloudflare1
    domains: ["mix.example.com", "*.mix.example.com"]
    # 证书级 deploy/deploy_account 可省略，改在每个域名项写 deploy
    dcdn_domains:
      - domain: "cdn.mix.example.com"
        deploy: aliyun_intl          # 只写平台 -> 账号自动取 aliyun_intl 分组下第一个（intl1）
    waf_domains:
      - domain: "waf.mix.example.com"
        waf_origin: "47.84.116.133"  # 源站写在域名项也支持（等同 origin）
        deploy: aliyun_intl
        deploy_account: intl1
        waf_zone: intl               # 非中国内地实例 -> ap-southeast-1，自动发现该地域唯一实例

# ---------------------------------------------------------------------------
# 旧格式迁移对照（改完即可删除本段）
#   旧：certificates[].domains + 顶层 dcdn_domains[]，每项用 cert 指向证书 name
#   新：把顶层 dcdn_domains 按 cert 分组，整段移进对应证书的 dcdn_domains；
#       删掉 cert 字段，同一账号的项改成字符串简写，证书级写一次 deploy + deploy_account。
#   例（旧）：
#     certificates:
#       - name: "example.org"
#         dns: cloudflare
#         dns_account: cloudflare1
#         domains: ["*.example.org", "example.org"]
#     dcdn_domains:
#       - domain: "www.example.org"
#         deploy_account: intl1
#         cert: "example.org"
#   等价于（新）：
#     certificates:
#       - name: "example.org"
#         dns: cloudflare
#         dns_account: cloudflare1
#         deploy: aliyun_intl
#         deploy_account: intl1
#         domains: ["*.example.org", "example.org"]
#         dcdn_domains: ["www.example.org"]
#   顶层写法脚本仍会自动回填，两种格式可混用一段时间。
# ---------------------------------------------------------------------------
