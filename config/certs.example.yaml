# cert-manager 配置示例
# 复制为 certs.yaml 后填写；也支持用环境变量 ${VAR} 注入 AK。
#
# 账号命名约定：阿里云按「站点+序号」cn1/intl1/cn2/intl2...；Cloudflare 按 cloudflare1/cloudflare2...
#
# 配置分两部分：
#   certificates:   要签发的证书（可泛域名 *.example.com；extra_domains 可把裸域等并入同一张证书）
#   dcdn_domains:   具体的 DCDN 加速域名，可显式用 cert 指定用哪张证书（不写则自动按后缀匹配）

accounts:
  # 阿里云账号：既可用于「DNS 验证」（dns=aliyun），也可用于「部署」（上传证书+绑定 DCDN）
  # 可任意增减 key（cn1 / intl1 / cn2 / intl2 ...），证书用 dns_account、域名用 deploy_account 引用
  cn1:
    access_key: "${CN1_AK}"
    access_secret: "${CN1_SK}"
    region: "cn-hangzhou"          # 国内站固定

  intl1:
    access_key: "${INTL1_AK}"
    access_secret: "${INTL1_SK}"
    region: "ap-southeast-1"       # 国际站
    # endpoint: "ap-southeast-1.aliyuncs.com"

  cn2:                              # 示例：第三个阿里云账号
    access_key: "${CN2_AK}"
    access_secret: "${CN2_SK}"
    region: "cn-hangzhou"

# Cloudflare DNS 验证凭证（仅当某证书 dns=cloudflare 时需要）
# 支持多账号：每个命名子账号一组 api_token；证书用 dns_account 指定用哪一个
cloudflare:
  cloudflare1:                      # 第一个 Cloudflare 账号
    api_token: "${CF_TOKEN_1}"      # -> acme.sh 的 CF_Token
    account_id: "${CF_ACCOUNT_ID_1}"  # 可选，多账号/部分区域需要 -> CF_Account_ID
    # email: "${CF_EMAIL}"          # 仅旧版 Global Key 方式需要 -> CF_Email

  cloudflare2:                      # 第二个 Cloudflare 账号（按需增减）
    api_token: "${CF_TOKEN_2}"
    account_id: "${CF_ACCOUNT_ID_2}"

# 要签发的证书（每个只签发一次，可被多个 DCDN 域名共用）
# 证书「主名 name」既作为引用标识，也作为 acme.sh 本地目录名。
# 同时覆盖裸域+泛域的常见写法（二选一）：
#   写法 A（推荐，主题即泛域）：name: "*.example.com" + extra_domains: ["example.com"]
#   写法 B（主题即裸域）：      name: "example.com"  + extra_domains: ["*.example.com"]
certificates:
  # 例1：国内站签一张证书，同时覆盖裸域 example.com 与泛域 *.example.com（写法 A）
  - name: "*.example.com"
    dns: aliyun
    dns_account: cn1
    extra_domains:
      - "example.com"

  # 例2：Cloudflare 验证、签一张泛域名证书（部署到国际站）
  - name: "*.example.org"
    dns: cloudflare
    dns_account: cloudflare1

# 具体的 DCDN 加速域名
#   deploy_account：证书上传并绑定到哪个阿里云账号
#   cert（可选）：显式指定用 certificates 里哪张证书（填其 name）。
#        多级子域（如 app.www.example.com）或存在多张证书时，显式指定可避免自动匹配歧义；
#        不写 cert 则回退为「按后缀自动匹配能覆盖它的证书」。
dcdn_domains:
  - domain: "www.example.com"
    deploy_account: cn1
    cert: "*.example.com"          # 显式指定证书（也可用写法 B 的 name: "example.com"）
  - domain: "api.example.com"
    deploy_account: cn1
    cert: "*.example.com"
  - domain: "example.com"          # 裸域，由例1 证书的 extra_domains 覆盖
    deploy_account: cn1
    cert: "*.example.com"
  - domain: "www.example.org"      # 匹配 *.example.org（DNS 在 CF，部署在国际站）
    deploy_account: intl1
    cert: "*.example.org"
