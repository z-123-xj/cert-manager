# cert-manager 配置示例
# 复制为 certs.yaml 后填写。
#
# 账号层级写在下面：aliyun_cn / aliyun_intl（下一层账号名可自定义）/ cloudflare；
# 凭证值用 ${VAR} 从 config/.env 注入（复制 .env.example 为 .env 并填写）。
# WAF 实例 ID 也在 .env（CN1_WAF_INSTANCE_ID 等，按账号名对应）。
# 服务器 crontab 里内联的同名环境变量优先级高于 .env。
#
# 第一层是平台、第二层是账号名：证书的 dns 填平台名（aliyun_cn/aliyun_intl/cloudflare），
# dns_account 填该平台下的账号名（cn1/intl1/cloudflare1），deploy_account 同理引用账号名。
#
# 配置以「证书」为单位：每张证书自带 dcdn_domains（DCDN 加速域名）和/或 waf_domains（WAF 防护域名）。
# 不再需要顶层 dcdn_domains，也不需要 cert 交叉引用。
# certificates[] 字段速查：
#   name            可选，证书标识 = CAS 证书名前缀；省略时取主域名
#   dns             可选，默认 aliyun_cn；平台名 aliyun_cn / aliyun_intl / cloudflare
#   dns_account     DNS-01 账号名：aliyun_* 平台下填对应分组里的账号名（如 cn1/intl1），
#                   cloudflare 平台下填 cloudflare 段的账号名（如 cloudflare1）
#   domains         可选，真正签进证书的 SAN 列表；省略时由 dcdn_domains + waf_domains 去重推导
#   deploy_account  可选，证书级默认部署账号；账号 key
#   dcdn_domains    要绑定的加速域名：字符串简写，或 {domain, deploy_account} 覆盖账号
#   waf_origin      WAF 证书级源站（IP 或域名），供所有 waf_domains 共用
#   waf_domains     WAF 防护域名：字符串列表即可；未接入的域名用 waf_origin 自动接入（HTTP 80 起步）
#                   （个别域名源站/账号不同时才展开 {domain, origin, deploy_account} 对象）
#
# 改完先跑：python3 certmgr.py --config config/certs.example.yaml --check
# 旧格式（顶层 dcdn_domains + cert 引用）仍可自动识别，见文件末尾迁移说明。

aliyun_cn:                         # 国内站阿里云账号组；下一层账号名可自定义（cn1/cn2/...）
  cn1:
    access_key: "${CN1_AK}"
    access_secret: "${CN1_SK}"
    region: "cn-hangzhou"

aliyun_intl:                       # 国际站阿里云账号组；下一层账号名可自定义（intl1/...）
  intl1:
    access_key: "${INTL1_AK}"
    access_secret: "${INTL1_SK}"
    region: "ap-southeast-1"
    # endpoint: "ap-southeast-1.aliyuncs.com"

cloudflare:
  cloudflare1:
    api_token: "${CF_TOKEN_1}"       # -> acme.sh 的 CF_Token
    account_id: "${CF_ACCOUNT_ID_1}" # 可选 -> CF_Account_ID
    # email: "${CF_EMAIL_1}"         # 仅旧版 Global Key 方式需要

certificates:
  # 例1：显式 domains —— 需要泛域 / 裸域 / 额外 SAN 时必须写。
  #      三个域名一次签成同一张 SAN 证书；xxx.example.com 只签不部署到 DCDN。
  - name: "example.com"
    dns: aliyun_cn
    dns_account: cn1
    deploy_account: cn1             # 下面所有域名的默认部署账号
    domains:
      - "example.com"
      - "*.example.com"
      - "xxx.example.com"
    dcdn_domains:
      - "www.example.com"           # 字符串简写：使用证书级 deploy_account
      - "api.example.com"
      - "app.example.com"
      - "example.com"
      - domain: "intl.example.com"  # 需要换账号时才展开成对象
        deploy_account: intl1

  # 例2：省略 domains —— 由 dcdn_domains 的域名去重推导 SAN（纯具体域名证书）。
  #      等价于 domains: ["cn.example.org", "www.example.org"]，推导后按字典序排序，
  #      首项即主域名（acme.sh 目录名）。想固定主域名或加泛域，请显式写 domains。
  - name: "example.org"
    dns: cloudflare
    dns_account: cloudflare1
    deploy_account: intl1
    dcdn_domains:
      - "www.example.org"
      - domain: "cn.example.org"
        deploy_account: cn1

  # 例3：WAF 3.0 防护域名。证书换名上传（acme_waf_ 前缀），不与 DCDN 同名冲突。
  #      统一用证书级 waf_origin（源站）+ waf_domains（域名字符串列表）即可，无需逐域名写 origin。
  #      已接入的域名只校验证书并按需切引用；确实未接入的用 waf_origin 自动 CreateDomain。
  - name: "waf.example.net"
    dns: aliyun_cn
    dns_account: cn1
    deploy_account: cn1
    domains: ["waf.example.net", "*.example.net"]   # waf 域名需在 SAN 内
    waf_origin: ["1.2.3.4", "1.2.3.5"]              # 源站 IP 或回源域名，供所有 waf 域名共用
    waf_domains:
      - "waf.example.net"            # 已接入 WAF：仅替换证书
      - "new.example.net"            # 未接入：用 waf_origin 自动接入再开 443 绑证书
    # 仅当某域名源站/账号与证书级不同时，才展开成对象（本例不需要）：
    #   - domain: "special.example.net"
    #     origin: ["5.6.7.8"]
    #     deploy_account: intl1

# ---------------------------------------------------------------------------
# 旧格式迁移对照（改完即可删除本段）
#   旧：certificates[].domains + 顶层 dcdn_domains[]，每项用 cert 指向证书 name
#   新：把顶层 dcdn_domains 按 cert 分组，整段移进对应证书的 dcdn_domains；
#       删掉 cert 字段，同一账号的项改成字符串简写，证书级写一次 deploy_account。
#   例（旧）：
#     certificates:
#       - name: "example.org"
#         dns: cloudflare
#         dns_account: cloudflare1
#         domains: ["*.example.org", "example.org"]
#     dcdn_domains:
#       - domain: "www.example.org"
#         deploy_account: intl1
#         cert: "example.org"
#   等价于（新）：
#     certificates:
#       - name: "example.org"
#         dns: cloudflare
#         dns_account: cloudflare1
#         deploy_account: intl1
#         domains: ["*.example.org", "example.org"]
#         dcdn_domains: ["www.example.org"]
#   顶层写法脚本仍会自动回填，两种格式可混用一段时间。
# ---------------------------------------------------------------------------
