aliyun_cn:                         # 国内站阿里云账号组（下一层账号名可自定义）
  cn1:
    access_key: "${CN1_AK}"
    access_secret: "${CN1_SK}"
    region: "cn-hangzhou"

aliyun_intl:                       # 国际站阿里云账号组
  intl1:
    access_key: "${INTL1_AK}"
    access_secret: "${INTL1_SK}"
    region: "ap-southeast-1"

cloudflare:
  cloudflare1:
    api_token: "${CF_TOKEN_1}"
    account_id: "${CF_ACCOUNT_ID_1}"

# WAF 实例 ID 在 config/.env 配 CN1_WAF_INSTANCE_ID / INTL1_WAF_INSTANCE_ID
# （用 --list-waf-instances 查看对应账号的实例 ID 后填写）

certificates:
  # ---------- 国际站 ----------
  - name: "ywjhsxl.com"
    dns: aliyun_intl
    dns_account: intl1
    deploy_account: intl1
