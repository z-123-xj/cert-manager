  # ---------- WAF ----------
  # 111wuw.bet 已在 WAF 接入：仅替换证书为 acme_waf_ 前缀那份，现有回源不动
  - name: "111wuw.bet"
    dns: cloudflare
    domains: ["111wuw.bet", "*.111wuw.bet"]
    waf_domains:
      - domain: "111wuw.bet"
        deploy: aliyun_cn
        waf_origin: "47.84.116.133"
        waf_zone: intl               # cn=中国内地(cn-hangzhou) / intl=非中国内地(ap-southeast-1)

  # 222wuw.bet 未接入：会用 waf_origin 自动 CreateDomain（HTTP 80 起步）再开 443 绑证书
  - name: "222wuw.bet"
    dns: cloudflare
    domains: ["222wuw.bet", "*.222wuw.bet"]
    waf_domains:
